# Smoke test: tiny math set, answer-only prompt, deterministic decoding.
name = "smoke"
dataset = "data/smoke_math.jsonl"
scorer = "numeric_match"
models = ["llama3.2:3b"]

[prompt]
system = "You are a careful math assistant."
user = """Solve the problem. End your response with a final line of the form 'Answer: <number>'.

Problem: {question}"""

[options]
temperature = 0
seed = 42
