spring.application.name=tokenforge
spring.main.banner-mode=off
logging.level.root=WARN

# Local Ollama server and which model to use (run `ollama pull <model>` first).
# Fits a 6 GB GPU: llama3.2:3b, qwen2.5:3b, gemma2:2b, phi3:mini
ollama.base-url=http://localhost:11434
ollama.model=llama3.2:3b

chat.system-prompt=You are a helpful, concise assistant.
